name: Website

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  WEBSITE_SITE_URL: ${{ vars.WEBSITE_SITE_URL || 'https://usemurmur.dev' }}
  WEBSITE_REVISION: ${{ github.sha }}
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || 'e357ed8d64611204842123ade5ea838f' }}

jobs:
  website:
    name: Verify and publish the institutional website
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the proposed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies from the reviewed lockfile
        run: bun install --frozen-lockfile

      - name: Install the isolated website toolchain from its reviewed lockfile
        run: bun install --cwd website --frozen-lockfile

      - name: Check website types and source
        run: bun run website:check

      - name: Exercise the artifact validation contract
        run: bun test test/website.test.ts test/website-markdown.test.ts test/website-identity.test.ts test/website-publication.test.ts website/test

      - name: Build the static website
        run: bun run website:build

      - name: Verify pages, metadata, links, assets, and performance budgets
        run: bun run website:test

      - name: Require production Pages credentials
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-fA-F]{32}$ ]]; then
            echo 'Set repository variable CLOUDFLARE_ACCOUNT_ID to the Pages account ID.' >&2
            exit 1
          fi
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo 'Set repository secret CLOUDFLARE_API_TOKEN with Cloudflare Pages Edit permission.' >&2
            exit 1
          fi

      - name: Install Node for Cloudflare publication
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.1

      - name: Verify authenticated Wrangler identity
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: "false"
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          website_identity="$(mktemp "$RUNNER_TEMP/murmur-website-identity.XXXXXX")"
          trap 'rm -f "$website_identity"' EXIT
          if ! timeout 45s node website/node_modules/wrangler/bin/wrangler.js whoami --json \
            2>/dev/null | head --bytes=65537 > "$website_identity"; then
            echo 'Wrangler authentication failed before the Pages upload.' >&2
            exit 1
          fi
          WEBSITE_IDENTITY_FILE="$website_identity" timeout 10s bun run scripts/verify-website-identity.ts

      - name: Deploy the verified revision to Cloudflare Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: "false"
        run: >-
          bun run --cwd website deploy
          --branch=main
          --commit-hash="$GITHUB_SHA"

      - name: Verify public HTML, Markdown sources, security headers, and the 404 response
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          website_origin="${WEBSITE_SITE_URL%/}"
          website_headers="$RUNNER_TEMP/murmur-website-headers.txt"
          website_body="$RUNNER_TEMP/murmur-website-body.txt"
          timeout 65s bun run scripts/verify-website-publication.ts
          for website_path in / /how-it-works /get-started /security /license /robots.txt; do
            website_status="$(curl --fail --silent --show-error --max-time 20 \
              --retry 3 --retry-max-time 60 \
              --max-filesize 1048576 --dump-header "$website_headers" \
              --output "$website_body" --write-out '%{http_code}' \
              "$website_origin$website_path")"
            if [[ "$website_status" != '200' ]]; then
              echo 'A canonical website route redirected or returned a non-200 response.' >&2
              exit 1
            fi
            if ! grep --ignore-case --quiet '^x-content-type-options: nosniff' "$website_headers"; then
              echo 'The published website is missing its nosniff security header.' >&2
              exit 1
            fi
            if ! grep --ignore-case --extended-regexp --quiet \
              '^cache-control:.*[[:space:],]no-transform([[:space:],]|$)' "$website_headers"; then
              echo 'The published website does not prevent proxy content transformations.' >&2
              exit 1
            fi
            if grep --extended-regexp --quiet 'static\.cloudflareinsights\.com|data-cf-beacon' "$website_body"; then
              echo 'The published website contains an injected analytics beacon.' >&2
              exit 1
            fi
          done
          markdown_paths=(index.md how-it-works.md get-started.md security.md license.md 404.html.md)
          markdown_sources=(index.md how-it-works.md get-started.md security.md license.md 404.md)
          for markdown_index in "${!markdown_paths[@]}"; do
            markdown_path="${markdown_paths[$markdown_index]}"
            markdown_source="${markdown_sources[$markdown_index]}"
            curl --fail --silent --show-error --max-time 20 --retry 3 --retry-max-time 60 \
              --max-filesize 1048576 --dump-header "$website_headers" \
              --output "$website_body" "$website_origin/$markdown_path"
            if ! grep --ignore-case --extended-regexp --quiet \
              '^content-type:[[:space:]]*text/markdown;[[:space:]]*charset=utf-8[[:space:]]*$' \
              "$website_headers"; then
              echo 'A published Markdown source has the wrong content type.' >&2
              exit 1
            fi
            if ! grep --ignore-case --extended-regexp --quiet \
              '^x-robots-tag:[[:space:]]*noindex([[:space:],]|$)' "$website_headers"; then
              echo 'A published Markdown source is missing its noindex header.' >&2
              exit 1
            fi
            if ! grep --ignore-case --quiet '^x-content-type-options: nosniff' "$website_headers"; then
              echo 'A published Markdown source is missing its nosniff header.' >&2
              exit 1
            fi
            if ! grep --ignore-case --extended-regexp --quiet \
              '^cache-control:.*[[:space:],]no-transform([[:space:],]|$)' "$website_headers"; then
              echo 'A published Markdown source permits proxy transformations.' >&2
              exit 1
            fi
            if ! cmp --silent "$website_body" "website/src/pages/$markdown_source"; then
              echo 'A published Markdown source differs from the authored page.' >&2
              exit 1
            fi
          done
          website_missing_status="$(curl --silent --show-error --max-time 20 \
            --dump-header "$website_headers" --output "$website_body" --write-out '%{http_code}' \
            "$website_origin/murmur-missing-page-$GITHUB_SHA")"
          if [[ "$website_missing_status" != '404' ]]; then
            echo 'The published website did not return HTTP 404 for an unknown route.' >&2
            exit 1
          fi
          if ! grep --fixed-strings --quiet 'This page isn’t here.' "$website_body"; then
            echo 'The published 404 response did not use the authored Markdown page.' >&2
            exit 1
          fi
          if ! grep --fixed-strings --quiet \
            "rel=\"alternate\" type=\"text/markdown\" href=\"$website_origin/404.html.md\"" \
            "$website_body"; then
            echo 'The published 404 response did not advertise its Markdown source.' >&2
            exit 1
          fi
