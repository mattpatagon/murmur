name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify code, migrations, and tenant isolation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: murmur_ci_admin_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Check out the proposed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run static verification
        run: bun run verify

      - name: Verify custom-CA Postgres TLS
        run: bash scripts/verify-postgres-tls.sh

      - name: Verify hosted Postgres and populated upgrades
        env:
          MURMUR_VERIFY_COVERAGE: "1"
        run: bash scripts/verify-hosted-postgres.sh

      - name: Build production entry points
        run: |
          bun run build
          bun run build:http
