name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  portability:
    name: Portability (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out the proposed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies from the reviewed lockfile
        run: bun install --frozen-lockfile

      - name: Run static and dependency policy gates
        run: bun run verify

      - name: Run the portable test contract
        run: bun run test:portability

      - name: Install and exercise the public package without repository access
        run: bun run test:distribution

      - name: Build both production entry points
        run: |
          bun run build
          bun run build:http

  verify:
    name: Hosted PostgreSQL, migrations, tenant isolation, and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: murmur_ci_admin_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Check out the proposed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies from the reviewed lockfile
        run: bun install --frozen-lockfile

      - name: Run static verification
        run: bun run verify

      - name: Verify custom-CA Postgres TLS
        run: bash scripts/verify-postgres-tls.sh

      - name: Verify hosted Postgres and populated upgrades
        env:
          MURMUR_VERIFY_COVERAGE: "1"
        run: bash scripts/verify-hosted-postgres.sh

      - name: Verify host-to-Linux-container MCP portability
        env:
          MURMUR_CI_DATABASE_PASSWORD: murmur_ci_admin_password
          MURMUR_DATABASE_TLS_INSECURE: "1"
        run: |
          MURMUR_TEST_DATABASE_URL="$(
            bun -e '
              const password = process.env.MURMUR_CI_DATABASE_PASSWORD;
              if (password === undefined) throw new Error("CI database password is missing");
              const url = new URL("postgresql://127.0.0.1:5432/postgres?sslmode=disable");
              url.username = "postgres";
              url.password = password;
              process.stdout.write(url.toString());
            '
          )"
          export MURMUR_TEST_DATABASE_URL
          bun run test:linux

      - name: Build production entry points
        run: |
          bun run build
          bun run build:http
