name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
  SERVICE: ${{ vars.GCP_SERVICE }}

jobs:
  deploy:
    name: Test, migrate, and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}

    steps:
      - name: Check out the merged revision
        uses: actions/checkout@v7

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run local verification
        run: bun run test

      - name: Authenticate for migrations
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}

      - name: Install Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Apply migrations and verify shared Postgres
        shell: bash
        run: |
          set -euo pipefail
          database_url="$(gcloud secrets versions access latest \
            --project "$PROJECT_ID" \
            --secret MURMUR_DATABASE_URL)"
          echo "::add-mask::$database_url"
          bunx supabase db push --db-url "$database_url" --include-all --yes
          MURMUR_TEST_DATABASE_URL="$database_url" bun run test:cloud

      - name: Build production image
        shell: bash
        run: |
          set -euo pipefail
          image="$REGION-docker.pkg.dev/$PROJECT_ID/$ARTIFACT_REPOSITORY/$SERVICE:$GITHUB_SHA"
          docker build --tag "$image" .
          echo "IMAGE=$image" >> "$GITHUB_ENV"

      - name: Refresh authentication for image push
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}

      - name: Push production image
        shell: bash
        run: |
          set -euo pipefail
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker push "$IMAGE"

      - name: Refresh authentication for deploy
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}

      - name: Deploy Cloud Run revision
        shell: bash
        run: |
          set -euo pipefail
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --image "$IMAGE" \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --set-secrets MURMUR_DATABASE_URL=MURMUR_DATABASE_URL:latest,MURMUR_API_TOKEN=MURMUR_API_TOKEN:latest \
            --concurrency 80 \
            --max-instances 1 \
            --memory 512Mi \
            --port 8080 \
            --timeout 3600 \
            --quiet

      - name: Verify production health
        shell: bash
        run: |
          set -euo pipefail
          health_url="${{ vars.PRODUCTION_URL }}/health"
          for attempt in {1..12}; do
            if curl --fail --silent --show-error "$health_url" | grep --fixed-strings '"status":"ok"'; then
              exit 0
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "Production health check failed after 12 attempts" >&2
              exit 1
            fi
            sleep 5
          done
